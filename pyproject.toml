[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeropub"
version = "0.1.0"
description = "Fleet-aware analysis of aeronautical publications — AIP, AIRAC, supplements, charts and NOTAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = []

[project.scripts]
aeropub = "aeropub.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only for reading an authority's onboarding spreadsheet. The platform itself
# is stdlib-only and stays that way: a deployment that never imports a
# credential never needs these, and `aeropub credentials --set` is always
# available instead.
onboarding = ["openpyxl>=3.1", "msoffcrypto-tool>=5.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The print template and the coastline ship with the package: a renderer
# that cannot find its template is a deployment that looks fine until
# somebody prints, and a map that has to fetch its own coastline is blank
# behind a firewall.
aeropub = ["templates/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
